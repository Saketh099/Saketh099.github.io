<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sunrise & Sunset Dashboard</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>🌞 Sunrise & Sunset Dashboard</h1>
    <p>Powered by <a href="https://sunrisesunset.io/api/" target="_blank">sunrisesunset.io</a></p>
  </header>

  <main>
    <section class="controls">
      <select id="locationSelect">
        <option value="">-- Select a Location --</option>
      </select>
      <button id="currentLocationBtn">📍 Use My Location</button>
    </section>

    <div id="error" class="hidden"></div>

    <section class="cards">
      <div class="card">
        <h2>Today</h2>
        <div id="todayCard" class="data">Please select a location.</div>
      </div>
      <div class="card">
        <h2>Tomorrow</h2>
        <div id="tomorrowCard" class="data">Please select a location.</div>
      </div>
    </section>
  </main>

  <footer>
    <p>&copy; 2025 | CS Project</p>
  </footer>

  <script src="script.js"></script>
</body>
</html
